name: Build Pramod Octapad Loop MIDI APKs

on:
  push:
    branches: [main]
    paths:
      - 'gradle_build/**'
      - 'mini_pro/**'
      - 'mini_spd30/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'gradle_build/**'
      - 'mini_pro/**'
      - 'mini_spd30/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper (main app)
        working-directory: gradle_build
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Generate Gradle wrapper (Mini Pro)
        working-directory: mini_pro
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Generate Gradle wrapper (Mini SPD-30)
        working-directory: mini_spd30
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build APKs
        working-directory: gradle_build
        run: |
          ./gradlew assembleFullDebug assembleLoopsDebug assembleDrumsDebug assembleProDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build Mini Pro APKs
        working-directory: mini_pro
        run: |
          ./gradlew assembleFullDebug assembleLoopsDebug assembleDrumsDebug assembleProDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build Mini SPD-30 APKs
        working-directory: mini_spd30
        run: |
          ./gradlew :app:assembleProDebug --no-daemon --stacktrace --warning-mode all

      - name: Prepare artifacts
        if: success()
        run: |
          mkdir -p artifacts
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          cp "gradle_build/app/build/outputs/apk/full/debug/app-full-debug.apk" "artifacts/PramodOctapad-Full-v1.0-debug-${SHORT}.apk"
          cp "gradle_build/app/build/outputs/apk/loops/debug/app-loops-debug.apk" "artifacts/PramodOctapad-Loops-v1.0-debug-${SHORT}.apk"
          cp "gradle_build/app/build/outputs/apk/drums/debug/app-drums-debug.apk" "artifacts/PramodOctapad-Drums-v1.0-debug-${SHORT}.apk"
          cp "gradle_build/app/build/outputs/apk/pro/debug/app-pro-debug.apk" "artifacts/PramodOctapad-Pro-v1.0-debug-${SHORT}.apk"
          cp "mini_pro/app/build/outputs/apk/full/debug/app-full-debug.apk" "artifacts/PramodOctapad-Mini-Full-v1.0-debug-${SHORT}.apk"
          cp "mini_pro/app/build/outputs/apk/loops/debug/app-loops-debug.apk" "artifacts/PramodOctapad-Mini-Loops-v1.0-debug-${SHORT}.apk"
          cp "mini_pro/app/build/outputs/apk/drums/debug/app-drums-debug.apk" "artifacts/PramodOctapad-Mini-Drums-v1.0-debug-${SHORT}.apk"
          cp "mini_pro/app/build/outputs/apk/pro/debug/app-pro-debug.apk" "artifacts/PramodOctapad-Mini-Pro-v1.0-debug-${SHORT}.apk"
          cp "mini_spd30/app/build/outputs/apk/pro/debug/app-pro-debug.apk" "artifacts/PramodOctapad-Mini-SPD30-v1.0-debug-${SHORT}.apk"
          ls -lh artifacts/

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pramod-octapad-apks
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
